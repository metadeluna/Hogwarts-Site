<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural — Hogwarts</title>
    <!-- Tailwind CSS para estruturação responsiva básica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP para animações mágicas de transição -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Georgia', serif;
        }

        /* =========================================================================
           FONTES PERSONALIZADAS COM FALLBACK SEGURO
           ========================================================================= */
        @font-face {
            font-family: 'Hogwarts-Titulo';
            src: url('src/fonts/CitadelofBlackrose.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Hogwarts-Paragrafo';
            src: url('src/fonts/Philosopher-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Hogwarts-SubTitulo';
            src: url('src/fonts/OPTIColumna-Solid.otf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .hogwarts-title {
            font-family: 'Hogwarts-Titulo', 'Georgia', serif;
        }

        .hogwarts-subtitle {
            font-family: 'Hogwarts-SubTitulo', 'Times New Roman', serif;
            letter-spacing: 2px;
        }

        .hogwarts-paragraph {
            font-family: 'Hogwarts-Paragrafo', 'Georgia', serif;
        }

        /* =========================================================================
           CENA PRINCIPAL E REVESTIMENTO
           ========================================================================= */
        #scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .layer,
        .gifs,
        .logo {
            position: absolute;
        }

        .background {
            width: 100%;
            height: 100%;
            object-fit: cover;
            left: 0;
            top: 0;
            object-position: center center;
            z-index: 1;
        }

        .gifs {
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* =========================================================================
           BANDEIRA FLUTUANTE DE CABEÇALHO (CANTO SUPERIOR ESQUERDO)
           ========================================================================= */
        .hanging-banner {
            position: absolute;
            left: 2vw;
            top: 1.5rem;
            width: 260px;
            height: 320px;
            background: url('src/ui/Banner_bandeira.png') no-repeat center center;
            background-size: 100% 100%;
            z-index: 25;
            padding: 4.2rem 1.6rem 1.6rem 1.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-radius: 0 0 6px 6px;
            animation: bannerSway 6s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes bannerSway {
            0%, 100% { transform: rotate(0.4deg); }
            50% { transform: rotate(-0.4deg); }
        }

        .hanging-banner h2 {
            font-size: 1.25rem;
            color: #ffd88a;
            text-shadow: 1px 2px 3px rgba(0, 0, 0, 0.95);
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            font-family: 'Hogwarts-SubTitulo', serif;
        }

        .hanging-banner p {
            font-size: 0.8rem;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
            line-height: 1.45;
            font-style: italic;
            font-family: 'Hogwarts-Paragrafo', sans-serif;
        }

        /* BOTÃO DE VOLTAR - AMPLIADO E CENTRALIZADO NO MEIO VERTICAL ESQUERDO */
        #back-from-sistemas {
            position: absolute;
            left: 2vw;
            top: 60%;
            transform: translateY(-50%) rotate(180deg);
            width: 5.2rem;
            height: 5.2rem;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.25s ease;
        }

        #back-from-sistemas:hover {
            transform: translateY(-50%) rotate(180deg) scale(1.12);
            filter: brightness(1.25);
        }

        #back-from-sistemas::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('src/ui/banner-seta.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 145%;
            z-index: 1;
        }

        #back-from-sistemas::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('src/ui/seta-aponta-direita.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 50%;
            z-index: 2;
        }

        /* =========================================================================
           MENU DE SISTEMAS (BOTÕES LATERAIS)
           ========================================================================= */
        .categorias-sidebar {
            position: absolute;
            left: 24%;
            top: 6vh;
            width: 20vw;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            z-index: 15;
            padding-left: 20px;
            max-height: 88vh;
            overflow: visible;
        }

        .categoria-tab {
            position: relative;
            width: 100%;
            min-height: 46px;
            background: url('src/ui/banner-titulo.png') no-repeat center center !important;
            background-size: 100% 100% !important;
            background-color: transparent !important;
            border: none !important;
            padding: 0.25rem 1.1rem;
            color: #f7e6ca;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-origin: left center;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), filter 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
        }

        .categoria-tab h3 {
            font-size: 0.74rem;
            color: #ffd88a;
            text-shadow: 1px 1.5px 2px rgba(0, 0, 0, 0.95);
            font-weight: bold;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1.1;
            font-family: 'Hogwarts-SubTitulo', serif;
        }

        .categoria-tab:hover:not(.active) {
            transform: scale(1.02) translateX(8px);
            filter: brightness(1.2) drop-shadow(0 0 6px rgba(255, 215, 122, 0.35));
        }

        .categoria-tab.active {
            transform: scale(1.04) translateX(22px);
            filter: brightness(1.35) drop-shadow(0 0 10px rgba(255, 222, 140, 0.6));
        }

        /* =========================================================================
           PLACA DE MADEIRA (MURAL) — substitui o pergaminho
           ========================================================================= */
        .mural-wrapper {
            position: absolute;
            left: 53%;
            top: 6.5vh;
            width: 30vw;
            height: 84vh;
            z-index: 6;
            display: flex;
            flex-direction: column;
            filter: drop-shadow(0 18px 34px rgba(0, 0, 0, .75)) drop-shadow(0 4px 10px rgba(0, 0, 0, .55));
        }

        /* halo escuro atrás do mural inteiro, para separá-lo do fundo */
        .mural-wrapper::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 120%;
            height: 108%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, .25) 55%, transparent 80%);
            z-index: -1;
            pointer-events: none;
        }

        /* topo triangular (frontão) */
        .placa-topo {
            position: relative;
            width: 100%;
            height: 6vh;
            min-height: 46px;
            margin-bottom: -2px;
            flex-shrink: 0;
        }

        .placa-topo::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 60%;
            height: 70%;
            background:
                url('src/madeira.png'),
                linear-gradient(135deg, #6b4a2e 0%, #4a3220 45%, #2e1f12 100%);
            background-size: cover, cover;
            background-blend-mode: overlay;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            box-shadow: 0 6px 14px rgba(0, 0, 0, .55);
        }

        .placa-topo::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 86%;
            height: 32%;
            background:
                url('src/madeira.png'),
                linear-gradient(180deg, #5e4128 0%, #3a2715 100%);
            background-size: cover, cover;
            background-blend-mode: overlay;
            border-radius: 3px;
            box-shadow:
                0 4px 8px rgba(0, 0, 0, .5),
                inset 0 1px 0 rgba(255, 220, 170, .12);
        }

        /* corpo principal (moldura de madeira que envolve o papel) */
        .placa-corpo {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            padding: 1.1rem;
            background:
                url('src/madeira.png'),
                repeating-linear-gradient(90deg, #5a3d24 0px, #4a3119 6px, #5a3d24 12px);
            background-size: cover, cover;
            background-blend-mode: overlay;
            border-radius: 4px;
            border: 2px solid rgba(0, 0, 0, .5);
            box-shadow:
                0 10px 26px rgba(0, 0, 0, .6),
                inset 0 0 0 2px rgba(0, 0, 0, .35),
                inset 0 0 30px rgba(0, 0, 0, .3);
            display: flex;
        }

        /* pregos decorativos nos cantos */
        .placa-prego {
            position: absolute;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #c9a05a, #5a3f1f 70%);
            box-shadow: 0 1px 2px rgba(0, 0, 0, .6);
            z-index: 5;
        }

        .placa-prego.tl { top: 10px; left: 10px; }
        .placa-prego.tr { top: 10px; right: 10px; }
        .placa-prego.bl { bottom: 10px; left: 10px; }
        .placa-prego.br { bottom: 10px; right: 10px; }

        /* friso interno mais claro */
        .placa-friso {
            position: relative;
            flex: 1;
            min-height: 0;
            padding: 9px;
            background: linear-gradient(180deg, #7a5530, #4f3520);
            border-radius: 3px;
            box-shadow: inset 0 0 0 1px rgba(255, 210, 150, .15);
            display: flex;
        }

        /* "papel" — onde o conteúdo do RPG é injetado (substitui scroll-area) */
        .scroll-area {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            background: linear-gradient(180deg, #f7f1e2 0%, #ece2c9 100%);
            border-radius: 2px;
            box-shadow:
                inset 0 0 25px rgba(120, 90, 40, .25),
                inset 0 2px 4px rgba(0, 0, 0, .25);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 15px;
            scrollbar-gutter: stable;
        }

        .scroll-area::-webkit-scrollbar {
            width: 8px;
        }

        .scroll-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background: #8e6c43;
            border-radius: 10px;
            border: 2px solid transparent;
        }

        /* cadeado decorativo lateral */
        .placa-cadeado {
            position: absolute;
            right: -14px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 34px;
            z-index: 16;
        }

        .placa-cadeado::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            border: 3px solid #9c7a3f;
            border-bottom: none;
            border-radius: 50% 50% 0 0;
        }

        .placa-cadeado::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 20px;
            background: linear-gradient(180deg, #c9a05a, #7a5a28);
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .5);
        }

        /* base/pedestal da placa */
        .placa-base {
            position: relative;
            width: 92%;
            margin: 0 auto;
            height: 22px;
            min-height: 18px;
            flex-shrink: 0;
            background:
                url('src/madeira.png'),
                linear-gradient(180deg, #4a3220, #2e1f12);
            background-size: cover, cover;
            background-blend-mode: overlay;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, .55);
        }

        .placa-base::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -8px;
            transform: translateX(-50%);
            width: 60%;
            height: 8px;
            background: linear-gradient(180deg, #2e1f12, #1a1108);
            border-radius: 0 0 6px 6px;
        }

        /* mãozinha decorativa (aponta-direita), uso: <span class="mao-indicadora"></span> */
        .mao-indicadora {
            display: inline-block;
            width: 1.3em;
            height: 1.3em;
            background: url('src/mao.webp') no-repeat center / contain;
            vertical-align: middle;
            margin-right: 0.4em;
            transform: translateY(-1px);
        }

        .content {
            width: 100%;
            height: auto;
            padding: 18px 14px 50px 14px;
            color: #120802;
            font-size: clamp(12px, 1.05vw, 16px);
            line-height: 1.55;
            text-align: justify;
        }

        .pergaminho-footer {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(92, 65, 46, 0.9);
            margin-top: 1rem;
            font-style: italic;
        }

        /* =========================================================================
           BLOCOS DE CONTEÚDO GENÉRICOS (PADRÃO REUTILIZÁVEL DE "SISTEMA")
           ========================================================================= */

        /* Título principal do sistema */
        .bloco-titulo-principal {
            font-family: 'Hogwarts-SubTitulo', 'Georgia', serif;
            font-size: clamp(1.6rem, 2.4vw, 2.6rem);
            font-weight: bold;
            color: #120802;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.2rem;
        }

        /* Bloco de imagem */
        .bloco-imagem {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5), 0 3px 6px rgba(0, 0, 0, 0.15);
            margin-bottom: 1.4rem;
            background: #201711;
        }

        .bloco-imagem img {
            width: 100%;
            height: auto;
            max-height: 240px;
            object-fit: cover;
            display: block;
            filter: grayscale(0.2) sepia(0.2) contrast(1.1);
        }

        /* Bloco de texto comum */
        .bloco-texto {
            font-family: 'Hogwarts-Paragrafo', 'Georgia', serif;
            font-size: 0.92rem;
            color: #1e0e03;
            text-align: justify;
            line-height: 1.6;
            margin-bottom: 0.9rem;
        }

        .bloco-texto .drop-cap {
            float: left;
            font-family: 'Georgia', serif;
            font-size: clamp(3.2rem, 4vw, 4.8rem);
            line-height: 0.75;
            padding-top: 4px;
            padding-right: 10px;
            padding-left: 2px;
            color: #241906;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.25);
        }

        /* Subtítulo de seção (não-acordeão) */
        .bloco-subtitulo {
            display: block;
            font-family: 'Hogwarts-SubTitulo', serif;
            font-size: clamp(1rem, 1.2vw, 1.3rem);
            font-weight: bold;
            color: #120802;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 1.6rem 0 0.5rem 0;
        }

        /* Divisória mágica entre blocos */
        .bloco-divisoria {
            width: 70%;
            max-width: 200px;
            height: auto;
            margin: 1.4rem auto;
            display: block;
            opacity: 0.85;
        }

        /* Lista numerada (regras, ações, etc.) */
        .bloco-lista {
            list-style: none;
            counter-reset: bloco-lista-contador;
            margin-bottom: 0.9rem;
            padding-left: 0;
        }

        .bloco-lista li {
            counter-increment: bloco-lista-contador;
            position: relative;
            padding-left: 2.1rem;
            margin-bottom: 0.85rem;
            font-family: 'Hogwarts-Paragrafo', 'Georgia', serif;
            font-size: 0.92rem;
            color: #1e0e03;
            text-align: justify;
            line-height: 1.55;
        }

        .bloco-lista li::before {
            content: counter(bloco-lista-contador) ".";
            position: absolute;
            left: 0;
            top: 0;
            font-family: 'Georgia', serif;
            font-weight: bold;
            color: #b38530;
            font-size: 0.95rem;
        }

        /* =========================================================================
           SEÇÕES EM ACORDEÃO
           ========================================================================= */
        .acordeao-secao {
            margin-bottom: 0.9rem;
            border: 1px solid rgba(92, 65, 46, 0.35);
            border-radius: 6px;
            background: rgba(246, 237, 219, 0.55);
            overflow: hidden;
        }

        .acordeao-cabecalho {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0.9rem 1.1rem;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
            font-family: 'Hogwarts-SubTitulo', serif;
            font-size: 0.98rem;
            font-weight: bold;
            color: #120802;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            transition: background 0.25s ease;
        }

        .acordeao-cabecalho:hover {
            background: rgba(179, 133, 48, 0.12);
        }

        .acordeao-cabecalho .acordeao-icone {
            font-family: 'Georgia', serif;
            font-size: 1.2rem;
            font-weight: bold;
            color: #b38530;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .acordeao-secao.aberta .acordeao-cabecalho .acordeao-icone {
            transform: rotate(45deg);
        }

        .acordeao-corpo {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            padding: 0 1.1rem;
        }

        .acordeao-secao.aberta .acordeao-corpo {
            padding: 0 1.1rem 1.1rem 1.1rem;
        }

        .acordeao-corpo .bloco-texto,
        .acordeao-corpo .bloco-lista,
        .acordeao-corpo .bloco-subtitulo {
            margin-top: 0;
        }

        .acordeao-corpo .bloco-subtitulo {
            font-size: 0.92rem;
            margin: 1.1rem 0 0.4rem 0;
        }

        .acordeao-corpo .bloco-subtitulo:first-child {
            margin-top: 0;
        }

        /* =========================================================================
           CRONOGRAMA — PAINEL DE DATA, CLIMA, LUA E EVENTOS
           ========================================================================= */
        .cronograma-cabecalho {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 1.2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(92, 65, 46, 0.35);
        }

        .cronograma-data {
            font-family: 'Hogwarts-SubTitulo', serif;
            font-size: clamp(1.1rem, 1.6vw, 1.5rem);
            color: #120802;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .cronograma-diasemana {
            font-family: 'Hogwarts-Paragrafo', serif;
            font-style: italic;
            font-size: 0.85rem;
            color: #5c412e;
        }

        .cronograma-ano {
            font-family: 'Hogwarts-Paragrafo', serif;
            font-size: 0.78rem;
            color: #7a5a3a;
            margin-top: 2px;
        }

        .cronograma-painel-duplo {
            display: flex;
            gap: 0.9rem;
            margin-bottom: 1.3rem;
        }

        .cronograma-card {
            flex: 1;
            background: rgba(246, 237, 219, 0.55);
            border: 1px solid rgba(92, 65, 46, 0.3);
            border-radius: 6px;
            padding: 0.8rem 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.35rem;
        }

        .cronograma-card-titulo {
            font-family: 'Hogwarts-SubTitulo', serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #7a5a3a;
        }

        .cronograma-card-valor {
            font-family: 'Hogwarts-Paragrafo', serif;
            font-size: 0.85rem;
            color: #1e0e03;
            line-height: 1.3;
        }

        /* ícone de clima, desenhado em CSS puro */
        .clima-icone {
            width: 38px;
            height: 38px;
            position: relative;
        }

        .clima-icone.nublado::before,
        .clima-icone.nublado::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(180deg, #cfc6b0, #8f8472);
            box-shadow: inset -3px -3px 4px rgba(0, 0, 0, .15);
        }

        .clima-icone.nublado::before {
            width: 26px;
            height: 26px;
            left: 4px;
            top: 6px;
        }

        .clima-icone.nublado::after {
            width: 20px;
            height: 20px;
            left: 16px;
            top: 10px;
        }

        .clima-icone.chuva::before,
        .clima-icone.chuva::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(180deg, #cfc6b0, #8f8472);
        }

        .clima-icone.chuva::before {
            width: 26px;
            height: 26px;
            left: 4px;
            top: 2px;
        }

        .clima-icone.chuva::after {
            width: 20px;
            height: 20px;
            left: 16px;
            top: 6px;
        }

            height: 100%;

        // =========================================================================
        // RENDERIZADOR GENÉRICO DE BLOCOS
        // =========================================================================
        function renderBloco(bloco) {
            switch (bloco.tipo) {
                case "titulo":
                    return `<h2 class="bloco-titulo-principal">${bloco.texto}</h2>`;

                case "imagem":
                    return `
                        <div class="bloco-imagem">
                            <img src="${bloco.url}" alt="${bloco.alt || ''}" onerror="this.parentElement.style.display='none'">
                        </div>
                    `;

                case "subtitulo":
                    return `<h4 class="bloco-subtitulo"><span class="mao-indicadora"></span>${bloco.texto}</h4>`;

                case "texto": {
                    const dropCapHTML = bloco.dropCap
                        ? `<span class="drop-cap">${bloco.dropCap}</span>`
                        : '';
                    return `<p class="bloco-texto">${dropCapHTML}${bloco.texto}</p>`;
                }

                case "lista": {
                    const itensHTML = bloco.itens.map(item => `<li>${item}</li>`).join('');
                    return `<ol class="bloco-lista">${itensHTML}</ol>`;
                }

                case "divisoria":
                    return `<img src="src/uidivisoria.png" class="bloco-divisoria" alt="Divisor Rúnico" onerror="this.style.display='none'">`;

                case "acordeao": {
                    const corpoHTML = bloco.blocos.map(renderBloco).join('');
                    return `
                        <div class="acordeao-secao">
                            <button class="acordeao-cabecalho" type="button">
                                <span>${bloco.titulo}</span>
                                <span class="acordeao-icone">+</span>
                            </button>
                            <div class="acordeao-corpo">
                                ${corpoHTML}
                            </div>
                        </div>
                    `;
                }

                default:
                    return '';
            }
        }

        function renderBlocos(blocos) {
            return blocos.map(renderBloco).join('');
        }

        // =========================================================================
        // CRONOGRAMA — leitura de cronograma.json e renderização do painel
        // =========================================================================
        function climaParaIcone(condicaoTexto, iconeForcado) {
            if (iconeForcado) return iconeForcado;
            const texto = (condicaoTexto || '').toLowerCase();
            if (texto.includes('chuva')) return 'chuva';
            if (texto.includes('nublado') || texto.includes('nuvens')) return 'nublado';
            return 'sol';
        }

        async function renderCronograma() {
            try {
                const resposta = await fetch('cronograma.json');
                const dados = await resposta.json();

                const iconeClima = climaParaIcone(dados.clima?.condicao, dados.clima?.icone);
                const faseLua = (dados.lua?.fase || 'cheia').toLowerCase()
                    .replace('quarto crescente', 'quarto-crescente')
                    .replace('quarto minguante', 'quarto-minguante');

                const eventosHTML = (dados.eventos || []).map(ev => `
                    <div class="cronograma-evento">
                        <div class="cronograma-evento-data">${ev.data}</div>
                        <div class="cronograma-evento-titulo">${ev.titulo}</div>
                        <div class="cronograma-evento-desc">${ev.descricao}</div>
                    </div>
                `).join('');

                return `
                    <h2 class="bloco-titulo-principal">Cronograma</h2>

                    <div class="cronograma-cabecalho">
                        <div class="cronograma-data">${dados.dataInGame}</div>
                        <div class="cronograma-diasemana">${dados.diaSemana}</div>
                        <div class="cronograma-ano">${dados.anoLetivo}</div>
                    </div>

                    <div class="cronograma-painel-duplo">
                        <div class="cronograma-card">
                            <div class="cronograma-card-titulo">Clima</div>
                            <div class="clima-icone ${iconeClima}"></div>
                            <div class="cronograma-card-valor">${dados.clima?.condicao || '—'}</div>
                            <div class="cronograma-card-valor">${dados.clima?.temperatura || ''}</div>
                        </div>
                        <div class="cronograma-card">
                            <div class="cronograma-card-titulo">Fase da Lua</div>
                            <div class="lua-icone lua-${faseLua}"></div>
                            <div class="cronograma-card-valor" style="text-transform:capitalize;">${dados.lua?.fase || '—'}</div>
                            <div class="cronograma-lua-obs">${dados.lua?.observacao || ''}</div>
                        </div>
                    </div>

                    <img src="src/uidivisoria.png" class="bloco-divisoria" alt="Divisor Rúnico" onerror="this.style.display='none'">

                    <div class="cronograma-eventos-titulo">Próximos Eventos</div>
                    ${eventosHTML || '<p class="bloco-texto" style="text-align:center;">Nenhum evento cadastrado.</p>'}
                `;
            } catch (erro) {
                console.warn('Não foi possível carregar cronograma.json:', erro);
                return `
                    <h2 class="bloco-titulo-principal">Cronograma</h2>
                    <p class="bloco-texto">Não foi possível carregar o arquivo <strong>cronograma.json</strong>. Verifique se ele está na mesma pasta deste arquivo.</p>
                `;
            }
        }

        // =========================================================================
        // TAÇA DAS CASAS — leitura de casas.json e renderização das ampulhetas
        // =========================================================================
        async function renderTacaDasCasas() {
            try {
                const resposta = await fetch('casas.json');
                const dados = await resposta.json();
                const maximo = dados.pontuacaoMaxima || Math.max(...dados.casas.map(c => c.pontos), 1);

                const casasOrdenadas = [...dados.casas].sort((a, b) => b.pontos - a.pontos);
                const lider = casasOrdenadas[0];

                const ordemPadrao = ['grifinoria', 'sonserina', 'corvinal', 'lufalufa'];
                const casasParaExibir = [...dados.casas].sort(
                    (a, b) => ordemPadrao.indexOf(a.id) - ordemPadrao.indexOf(b.id)
                );

                const casasHTML = casasParaExibir.map(casa => {
                    const proporcao = Math.max(0, Math.min(1, casa.pontos / maximo));
                    const alturaMax = 38; // altura máxima útil de cada metade da ampulheta, em px
                    const alturaBaixo = Math.round(proporcao * alturaMax);
                    const alturaCima = alturaMax - alturaBaixo;

                    return `
                        <div class="taca-casa">
                            <img class="taca-logo" src="${casa.logo}" alt="${casa.nome}" onerror="this.style.display='none'">
                            <div class="ampulheta">
                                <div class="ampulheta-cap-topo"></div>
                                <div class="ampulheta-vidro"></div>
                                <div class="ampulheta-areia-cima" style="height:${alturaCima}px;"></div>
                                <div class="ampulheta-areia-baixo" style="height:${alturaBaixo}px;"></div>
                                <div class="ampulheta-cap-base"></div>
                            </div>
                            <div class="taca-nome">${casa.nome}</div>
                            <div class="taca-pontos">${casa.pontos} pts</div>
                        </div>
                    `;
                }).join('');

                const historicoHTML = (dados.historico || []).map(h => `
                    <li class="taca-historico-item">
                        <span class="taca-historico-ano">${h.ano}</span>
                        <span class="taca-historico-campea">${h.campea}</span>
                    </li>
                `).join('');

                return `
                    <h2 class="bloco-titulo-principal">Taça das Casas</h2>

                    <div class="taca-lider-banner">No momento, lidera a <strong>${lider.nome}</strong></div>

                    <div class="taca-fileira">
                        ${casasHTML}
                    </div>

                    <img src="src/uidivisoria.png" class="bloco-divisoria" alt="Divisor Rúnico" onerror="this.style.display='none'">

                    <div class="taca-historico-titulo">Campeãs de Anos Anteriores</div>
                    <ul class="taca-historico-lista">
                        ${historicoHTML || '<li class="taca-historico-item">Nenhum histórico cadastrado.</li>'}
                    </ul>
                `;
            } catch (erro) {
                console.warn('Não foi possível carregar casas.json:', erro);
                return `
                    <h2 class="bloco-titulo-principal">Taça das Casas</h2>
                    <p class="bloco-texto">Não foi possível carregar o arquivo <strong>casas.json</strong>. Verifique se ele está na mesma pasta deste arquivo.</p>
                `;
            }
        }

        // =========================================================================
        // MOTOR DE ATUALIZAÇÃO DO PERGAMINHO (GSAP INTEGRADO)
        // =========================================================================
        const parchmentScrollArea = document.getElementById('parchment-scroll-area');
        const sistemasContainer = document.getElementById('sistemas-container');

        function setupAcordeoes() {
            const cabecalhos = sistemasContainer.querySelectorAll('.acordeao-cabecalho');
            cabecalhos.forEach(cabecalho => {
                cabecalho.addEventListener('click', () => {
                    const secao = cabecalho.closest('.acordeao-secao');
                    const corpo = secao.querySelector('.acordeao-corpo');
                    const estaAberta = secao.classList.contains('aberta');

                    if (estaAberta) {
                        secao.classList.remove('aberta');
                        corpo.style.maxHeight = '0px';
                    } else {
                        secao.classList.add('aberta');
                        corpo.style.maxHeight = corpo.scrollHeight + 'px';
                    }
                });
            });
        }

        function updateSistema(sistemaId) {
            const sistemasEspeciais = {
                cronograma: renderCronograma,
                taca: renderTacaDasCasas
            };

            const ehEspecial = Object.prototype.hasOwnProperty.call(sistemasEspeciais, sistemaId);
            const sistema = sistemasDatabase[sistemaId];

            if (!ehEspecial && !sistema) return;

            gsap.to(sistemasContainer, {
                opacity: 0,
                y: 15,
                duration: 0.22,
                ease: "power2.in",
                onComplete: async () => {
                    const conteudoHTML = ehEspecial
                        ? await sistemasEspeciais[sistemaId]()
                        : renderBlocos(sistema.blocos);

                    sistemasContainer.innerHTML = `
                        ${conteudoHTML}
                        <div class="pergaminho-footer">MURAL • Hogwarts RPG</div>
                    `;

                    parchmentScrollArea.scrollTop = 0;
                    setupAcordeoes();

                    gsap.fromTo(sistemasContainer,
                        { opacity: 0, y: -15 },
                        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }
                    );
                }
            });
        }

        // Configuração e interações das abas do menu lateral
        function setupTabs() {
            const tabs = document.querySelectorAll('.categoria-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    if (tab.classList.contains('active')) return;

                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    const sistemaId = tab.getAttribute('data-sistema');
                    updateSistema(sistemaId);
                });
            });
        }

        // =========================================================================
        // SISTEMA DE ÁUDIO E TRILHA SONORA DA VITROLA
        // =========================================================================
        const vitrola = document.querySelector('.vitrola');
        const nextBtn = document.querySelector('.vitrola-next');
        const audio = document.getElementById('vinyl-audio');

        const tracks = ['hogsmeade.mp3', 'becodiagonal.mp3', 'housecup.mp3', 'overtue.mp3'];
        const trackBasePath = 'src/';
        let currentTrackIndex = 0;

        function updateNextButton() {
            if (audio.paused) {
                nextBtn.classList.remove('visible');
            } else {
                nextBtn.classList.add('visible');
            }
        }

        function setTrack(index) {
            currentTrackIndex = ((index % tracks.length) + tracks.length) % tracks.length;
            const fullPath = `${trackBasePath}${tracks[currentTrackIndex]}`;
            audio.src = fullPath;
            audio.load();
        }

        async function playTrack() {
            try {
                await audio.play();
                vitrola.classList.add('playing');
                updateNextButton();
            } catch (err) {
                console.warn("Autoplay impedido ou áudios locais indisponíveis:", err);
            }
        }

        vitrola.addEventListener('click', () => {
            if (audio.paused) {
                playTrack();
            } else {
                audio.pause();
                vitrola.classList.remove('playing');
                updateNextButton();
            }
        });

        nextBtn.addEventListener('click', () => {
            setTrack(currentTrackIndex + 1);
            playTrack();
        });

        audio.addEventListener('ended', () => {
            setTrack(currentTrackIndex + 1);
            playTrack();
        });

        // =========================================================================
        // DISPARADORES NO CARREGAMENTO DA PÁGINA
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            setupTabs();
            updateSistema('duelos');
            setTrack(currentTrackIndex);

            gsap.from('.categoria-tab', {
                opacity: 0,
                x: -30,
                duration: 0.65,
                stagger: 0.07,
                ease: "power2.out",
                onComplete: () => {
                    gsap.set('.categoria-tab', { clearProps: "transform" });
                }
            });
        });
    </script>
</body>

</html>
