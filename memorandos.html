<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorandos — Hogwarts</title>
    <!-- Tailwind CSS para estruturação responsiva básica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP para animações mágicas de transição -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Georgia', serif;
        }

        /* =========================================================================
           FONTES PERSONALIZADAS COM FALLBACK SEGURO
           ========================================================================= */
        @font-face {
            font-family: 'Hogwarts-Titulo';
            src: url('src/fonts/CitadelofBlackrose.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Hogwarts-Paragrafo';
            src: url('src/fonts/Philosopher-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Hogwarts-SubTitulo';
            src: url('src/fonts/OPTIColumna-Solid.otf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .hogwarts-title {
            font-family: 'Hogwarts-Titulo', 'Georgia', serif;
        }

        .hogwarts-subtitle {
            font-family: 'Hogwarts-SubTitulo', 'Times New Roman', serif;
            letter-spacing: 2px;
        }

        .hogwarts-paragraph {
            font-family: 'Hogwarts-Paragrafo', 'Georgia', serif;
        }

        /* =========================================================================
           CENA PRINCIPAL E REVESTIMENTO
           ========================================================================= */
        #scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .layer,
        .gifs,
        .logo,
        .scroll-area {
            position: absolute;
        }

        .background {
            width: 100%;
            height: 100%;
            object-fit: cover;
            left: 0;
            top: 0;
            object-position: center center;
            z-index: 1;
        }

        .gifs {
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* =========================================================================
           BANDEIRA FLUTUANTE DE CABEÇALHO (CANTO SUPERIOR ESQUERDO)
           ========================================================================= */
        .hanging-banner {
            position: absolute;
            left: 2vw;
            top: 1.5rem;
            width: 260px;
            height: 320px;
            background: url('src/ui/Banner_bandeira.png') no-repeat center center;
            background-size: 100% 100%;
            z-index: 25;
            padding: 4.2rem 1.6rem 1.6rem 1.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-radius: 0 0 6px 6px;
            animation: bannerSway 6s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes bannerSway {
            0%, 100% { transform: rotate(0.4deg); }
            50% { transform: rotate(-0.4deg); }
        }

        .hanging-banner h2 {
            font-size: 1.25rem;
            color: #ffd88a;
            text-shadow: 1px 2px 3px rgba(0, 0, 0, 0.95);
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            font-family: 'Hogwarts-SubTitulo', serif;
        }

        .hanging-banner p {
            font-size: 0.8rem;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
            line-height: 1.45;
            font-style: italic;
            font-family: 'Hogwarts-Paragrafo', sans-serif;
        }

        /* BOTÃO DE VOLTAR - AMPLIADO E CENTRALIZADO NO MEIO VERTICAL ESQUERDO */
        #back-from-memorandos {
            position: absolute;
            left: 2vw;
            top: 60%;
            transform: translateY(-50%) rotate(180deg);
            width: 5.2rem;
            height: 5.2rem;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.25s ease;
        }

        #back-from-memorandos:hover {
            transform: translateY(-50%) rotate(180deg) scale(1.12);
            filter: brightness(1.25);
        }

        #back-from-memorandos::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('src/ui/banner-seta.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 145%;
            z-index: 1;
        }

        #back-from-memorandos::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('src/ui/seta-aponta-direita.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 50%;
            z-index: 2;
        }

        /* =========================================================================
           MENU DE MEMORANDOS (BOTÕES LATERAIS)
           ========================================================================= */
        .categorias-sidebar {
            position: absolute;
            left: 24%;
            top: 11vh;
            width: 20vw;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            z-index: 15;
            padding-left: 20px;
        }

        .categoria-tab {
            position: relative;
            width: 100%;
            min-height: 58px;
            background: url('src/ui/banner-titulo.png') no-repeat center center !important;
            background-size: 100% 100% !important;
            background-color: transparent !important;
            border: none !important;
            padding: 0.3rem 1.2rem;
            color: #f7e6ca;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-origin: left center;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), filter 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
        }

        .categoria-tab h3 {
            font-size: 0.85rem;
            color: #ffd88a;
            text-shadow: 1px 1.5px 2px rgba(0, 0, 0, 0.95);
            font-weight: bold;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1.1;
            font-family: 'Hogwarts-SubTitulo', serif;
        }

        .categoria-tab:hover:not(.active) {
            transform: scale(1.02) translateX(8px);
            filter: brightness(1.2) drop-shadow(0 0 6px rgba(255, 215, 122, 0.35));
        }

        .categoria-tab.active {
            transform: scale(1.04) translateX(22px);
            filter: brightness(1.35) drop-shadow(0 0 10px rgba(255, 222, 140, 0.6));
        }

        /* =========================================================================
           PERGAMINHO & ÁREA DE CONTEÚDO (DIREITA)
           ========================================================================= */
        .pergaminho {
            position: absolute;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center center;
            z-index: 4;
            pointer-events: none;
        }

        .scroll-area {
            z-index: 6;
            left: 53.5%;
            top: 10vh;
            width: 26.5vw;
            height: 76vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 15px;
            scrollbar-gutter: stable;
        }

        .scroll-area::-webkit-scrollbar {
            width: 8px;
        }

        .scroll-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background: #8e6c43;
            border-radius: 10px;
            border: 2px solid transparent;
        }

        .content {
            width: 100%;
            height: auto;
            padding: 5px 10px 50px 10px;
            color: #120802;
            font-size: clamp(12px, 1.05vw, 16px);
            line-height: 1.55;
            text-align: justify;
        }

        .pergaminho-footer {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(92, 65, 46, 0.9);
            margin-top: 1rem;
            font-style: italic;
        }

        /* =========================================================================
           BLOCOS DE CONTEÚDO GENÉRICOS (PADRÃO REUTILIZÁVEL DE "SISTEMA")
           ========================================================================= */

        /* Título principal do sistema */
        .bloco-titulo-principal {
            font-family: 'Hogwarts-SubTitulo', 'Georgia', serif;
            font-size: clamp(1.6rem, 2.4vw, 2.6rem);
            font-weight: bold;
            color: #120802;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.2rem;
        }

        /* Bloco de imagem */
        .bloco-imagem {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5), 0 3px 6px rgba(0, 0, 0, 0.15);
            margin-bottom: 1.4rem;
            background: #201711;
        }

        .bloco-imagem img {
            width: 100%;
            height: auto;
            max-height: 240px;
            object-fit: cover;
            display: block;
            filter: grayscale(0.2) sepia(0.2) contrast(1.1);
        }

        /* Bloco de texto comum */
        .bloco-texto {
            font-family: 'Hogwarts-Paragrafo', 'Georgia', serif;
            font-size: 0.92rem;
            color: #1e0e03;
            text-align: justify;
            line-height: 1.6;
            margin-bottom: 0.9rem;
        }

        .bloco-texto .drop-cap {
            float: left;
            font-family: 'Georgia', serif;
            font-size: clamp(3.2rem, 4vw, 4.8rem);
            line-height: 0.75;
            padding-top: 4px;
            padding-right: 10px;
            padding-left: 2px;
            color: #241906;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.25);
        }

        /* Subtítulo de seção (não-acordeão) */
        .bloco-subtitulo {
            display: block;
            font-family: 'Hogwarts-SubTitulo', serif;
            font-size: clamp(1rem, 1.2vw, 1.3rem);
            font-weight: bold;
            color: #120802;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 1.6rem 0 0.5rem 0;
        }

        /* Divisória mágica entre blocos */
        .bloco-divisoria {
            width: 70%;
            max-width: 200px;
            height: auto;
            margin: 1.4rem auto;
            display: block;
            opacity: 0.85;
        }

        /* Lista numerada (regras, ações, etc.) */
        .bloco-lista {
            list-style: none;
            counter-reset: bloco-lista-contador;
            margin-bottom: 0.9rem;
            padding-left: 0;
        }

        .bloco-lista li {
            counter-increment: bloco-lista-contador;
            position: relative;
            padding-left: 2.1rem;
            margin-bottom: 0.85rem;
            font-family: 'Hogwarts-Paragrafo', 'Georgia', serif;
            font-size: 0.92rem;
            color: #1e0e03;
            text-align: justify;
            line-height: 1.55;
        }

        .bloco-lista li::before {
            content: counter(bloco-lista-contador) ".";
            position: absolute;
            left: 0;
            top: 0;
            font-family: 'Georgia', serif;
            font-weight: bold;
            color: #1e0e03;
            font-size: 0.95rem;
        }

        /* =========================================================================
           SEÇÕES EM ACORDEÃO
           ========================================================================= */
        .acordeao-secao {
            margin-bottom: 0.9rem;
            border: 1px solid rgba(92, 65, 46, 0.35);
            border-radius: 6px;
            background: rgba(246, 237, 219, 0.55);
            overflow: hidden;
        }

        .acordeao-cabecalho {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0.9rem 1.1rem;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
            font-family: 'Hogwarts-SubTitulo', serif;
            font-size: 0.98rem;
            font-weight: bold;
            color: #120802;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            transition: background 0.25s ease;
        }

        .acordeao-cabecalho:hover {
            background: rgba(179, 133, 48, 0.12);
        }

        .acordeao-cabecalho .acordeao-icone {
            font-family: 'Georgia', serif;
            font-size: 1.2rem;
            font-weight: bold;
            color: #b38530;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .acordeao-secao.aberta .acordeao-cabecalho .acordeao-icone {
            transform: rotate(45deg);
        }

        .acordeao-corpo {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            padding: 0 1.1rem;
        }

        .acordeao-secao.aberta .acordeao-corpo {
            padding: 0 1.1rem 1.1rem 1.1rem;
        }

        .acordeao-corpo .bloco-texto,
        .acordeao-corpo .bloco-lista,
        .acordeao-corpo .bloco-subtitulo {
            margin-top: 0;
        }

        .acordeao-corpo .bloco-subtitulo {
            font-size: 0.92rem;
            margin: 1.1rem 0 0.4rem 0;
        }

        .acordeao-corpo .bloco-subtitulo:first-child {
            margin-top: 0;
        }
    </style>
</head>

        // =========================================================================
        // RENDERIZADOR GENÉRICO DE BLOCOS
        // =========================================================================
        function renderBloco(bloco) {
            switch (bloco.tipo) {
                case "titulo":
                    return `<h2 class="bloco-titulo-principal">${bloco.texto}</h2>`;

                case "imagem":
                    return `
                        <div class="bloco-imagem">
                            <img src="${bloco.url}" alt="${bloco.alt || ''}" onerror="this.parentElement.style.display='none'">
                        </div>
                    `;

                case "subtitulo":
                    return `<h4 class="bloco-subtitulo">${bloco.texto}</h4>`;

                case "texto": {
                    const dropCapHTML = bloco.dropCap
                        ? `<span class="drop-cap">${bloco.dropCap}</span>`
                        : '';
                    return `<p class="bloco-texto">${dropCapHTML}${bloco.texto}</p>`;
                }

                case "lista": {
                    const itensHTML = bloco.itens.map(item => `<li>${item}</li>`).join('');
                    return `<ol class="bloco-lista">${itensHTML}</ol>`;
                }

                case "divisoria":
                    return `<img src="src/ui/divisoria.png" class="bloco-divisoria" alt="Divisor Rúnico" onerror="this.style.display='none'">`;

                case "acordeao": {
                    const corpoHTML = bloco.blocos.map(renderBloco).join('');
                    return `
                        <div class="acordeao-secao">
                            <button class="acordeao-cabecalho" type="button">
                                <span>${bloco.titulo}</span>
                                <span class="acordeao-icone">+</span>
                            </button>
                            <div class="acordeao-corpo">
                                ${corpoHTML}
                            </div>
                        </div>
                    `;
                }

                default:
                    return '';
            }
        }

        function renderBlocos(blocos) {
            return blocos.map(renderBloco).join('');
        }

        // =========================================================================
        // MOTOR DE ATUALIZAÇÃO DO PERGAMINHO (GSAP INTEGRADO)
        // =========================================================================
        const parchmentScrollArea = document.getElementById('parchment-scroll-area');
        const memorandosContainer = document.getElementById('memorandos-container');

        function setupAcordeoes() {
            const cabecalhos = memorandosContainer.querySelectorAll('.acordeao-cabecalho');
            cabecalhos.forEach(cabecalho => {
                cabecalho.addEventListener('click', () => {
                    const secao = cabecalho.closest('.acordeao-secao');
                    const corpo = secao.querySelector('.acordeao-corpo');
                    const estaAberta = secao.classList.contains('aberta');

                    if (estaAberta) {
                        secao.classList.remove('aberta');
                        corpo.style.maxHeight = '0px';
                    } else {
                        secao.classList.add('aberta');
                        corpo.style.maxHeight = corpo.scrollHeight + 'px';
                    }
                });
            });
        }

        function updateSistema(sistemaId) {
            const sistema = memorandosDatabase[sistemaId];
            if (!sistema) return;

            gsap.to(memorandosContainer, {
                opacity: 0,
                y: 15,
                duration: 0.22,
                ease: "power2.in",
                onComplete: () => {
                    memorandosContainer.innerHTML = `
                        ${renderBlocos(sistema.blocos)}
                        <div class="pergaminho-footer">MEMORANDOS • Hogwarts RPG</div>
                    `;

                    parchmentScrollArea.scrollTop = 0;
                    setupAcordeoes();

                    gsap.fromTo(memorandosContainer,
                        { opacity: 0, y: -15 },
                        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }
                    );
                }
            });
        }

        // Configuração e interações das abas do menu lateral
        function setupTabs() {
            const tabs = document.querySelectorAll('.categoria-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    if (tab.classList.contains('active')) return;

                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    const sistemaId = tab.getAttribute('data-sistema');
                    updateSistema(sistemaId);
                });
            });
        }

        // =========================================================================
        // SISTEMA DE ÁUDIO E TRILHA SONORA DA VITROLA
        // =========================================================================
        const vitrola = document.querySelector('.vitrola');
        const nextBtn = document.querySelector('.vitrola-next');
        const audio = document.getElementById('vinyl-audio');

        const tracks = ['hogsmeade.mp3', 'becodiagonal.mp3', 'housecup.mp3', 'overtue.mp3'];
        const trackBasePath = 'src/';
        let currentTrackIndex = 0;

        function updateNextButton() {
            if (audio.paused) {
                nextBtn.classList.remove('visible');
            } else {
                nextBtn.classList.add('visible');
            }
        }

        function setTrack(index) {
            currentTrackIndex = ((index % tracks.length) + tracks.length) % tracks.length;
            const fullPath = `${trackBasePath}${tracks[currentTrackIndex]}`;
            audio.src = fullPath;
            audio.load();
        }

        async function playTrack() {
            try {
                await audio.play();
                vitrola.classList.add('playing');
                updateNextButton();
            } catch (err) {
                console.warn("Autoplay impedido ou áudios locais indisponíveis:", err);
            }
        }

        vitrola.addEventListener('click', () => {
            if (audio.paused) {
                playTrack();
            } else {
                audio.pause();
                vitrola.classList.remove('playing');
                updateNextButton();
            }
        });

        nextBtn.addEventListener('click', () => {
            setTrack(currentTrackIndex + 1);
            playTrack();
        });

        audio.addEventListener('ended', () => {
            setTrack(currentTrackIndex + 1);
            playTrack();
        });

        // =========================================================================
        // DISPARADORES NO CARREGAMENTO DA PÁGINA
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            setupTabs();
            updateSistema('agradecimentos');
            setTrack(currentTrackIndex);

            gsap.from('.categoria-tab', {
                opacity: 0,
                x: -30,
                duration: 0.65,
                stagger: 0.07,
                ease: "power2.out",
                onComplete: () => {
                    gsap.set('.categoria-tab', { clearProps: "transform" });
                }
            });
        });
    </script>
